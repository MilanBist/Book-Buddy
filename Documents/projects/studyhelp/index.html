<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Chill and Do</title>
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header id="header">
        <h1>CHILL AND DO</h1>
    </header>

    <section id = 'main_body'>
        <div class="sidebar_logo">
            <button id="sidebar_logo"><i class='bx  bx-cursor-click'></i> </button>
        </div>
        <div id="sidebar">
            <ul id="sidebar_list">

                <li class="sidebar_items" >
                    <span>
                        <i class='bx  bx-cloud-rain-wind-alt' data-value="myday"></i> 
                        <p>My Day</p>
                    </span>
                </li>

                <li class="sidebar_items" >
                    <span>
                        <i class='bx  bx-enter' data-value="preview"></i> 
                        <p>Preview</p>
                    </span>
                </li>

                <li class="sidebar_items" >
                    <span>
                        <i class='bx  bx-clock' data-value="timer"></i> 
                        <p>Timer</p>
                    </span>
                </li>

                <li class="sidebar_items" >
                    <span>
                        <i class='bx  bx-flag-chequered' data-value="finished"></i> 
                        <p>Finished</p>
                    </span>
                    </li>

                <li class="sidebar_items" >
                    <span>
                        <i class='bx  bx-task' data-value="tasks"></i> 
                        <p>Task</p>
                    </span>
                    </li>
            </ul>
        </div>
        <div id="body">
            <h2></h2>
            <div id="image_place">

            </div>
        </div>
    </section>


    <script src="app.js"></script>
</body>
</html>
